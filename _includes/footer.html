<span class="about_link down">
  <a href="#body" data-scroll>{% include arrow-up-bottom.html %}</a>
</span>
<footer class="footer">
  <p><i class="far fa-copyright"></i> {{ site.time | date: '%Y' }} &bull; {{site.username}} &bull; Last updated: {{ site.time | date: '%B %Y' }}</p>
  {% if site.email_address %}
  <p><i class="fas fa-mail-bulk"></i> {{ site.email_address }}</p>
  {% endif %}
</footer>
<script src="{{ "/assets/js/sweet-scroll.min.js" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ "/assets/js/main.js" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}"></script>
